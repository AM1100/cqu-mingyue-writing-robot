<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="28" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F7F9FC" />
<g id="title" data-pptx-bounds="56 38 1168 108" fill="#173B57"><text x="56" y="65" font-size="20" fill="#2867A8">07 / 电气标定</text><text x="56" y="120" font-size="44" font-weight="bold">几何角与电气角必须分开</text></g>
<g id="pulse-mapping" data-pptx-bounds="56 174 1168 148"><rect x="56" y="174" width="1168" height="148" rx="12" fill="#EAF0F7" /><g id="pulse-equation" data-pptx-replace-with="formula" data-pptx-x="80" data-pptx-y="198" data-pptx-width="700" data-pptx-height="82" data-pptx-bounds="80 198 700 82"><metadata type="application/json"><![CDATA[{"latex":"u=1500+k[d(\\theta-\\theta_0)+t]","display":"block","font_size":26,"color":"#173B57","align":"left"}]]></metadata><text x="80" y="248" font-size="26" fill="#173B57">u = 1500 + k [d(θ − θ₀) + t]</text></g><text x="80" y="303" font-size="20" fill="#586B7D">u：脉宽 μs　θ：几何角　θ₀：中位参考角　d：方向　k：μs/°　t：微调</text></g>
<g id="installation-reference" data-pptx-bounds="56 360 554 208" fill="#213547"><text x="56" y="399" font-size="32" font-weight="bold" fill="#173B57">安装决定零位与方向</text><text x="56" y="457">1500 μs 对应什么几何姿态，<tspan x="56" dy="43">取决于舵盘安装与旋转方向。</tspan></text><text x="56" y="552" font-size="20" fill="#586B7D">居中是坐标问题，不是把指令改成 175°。</text></g>
<g id="two-point-calibration" data-pptx-bounds="660 360 564 208" fill="#213547"><text x="660" y="399" font-size="32" font-weight="bold" fill="#D97421">两点实测决定增益</text><text x="660" y="457">左右独立标定，再校验行程；<tspan x="660" dy="43">第三路抬落笔保持独立参数。</tspan></text><text x="660" y="552" font-size="20" fill="#586B7D">当前 k≈5.556 是保留配置，尚非实测结论。</text></g>
<g id="calibration-takeaway" data-pptx-bounds="56 593 1168 46"><text x="56" y="624" fill="#173B57">方向反转应改映射方向；不能用负脉宽，也不盲目扩大限位。</text></g>
<text id="footer" data-pptx-role="footer" x="56" y="674" font-size="14" fill="#586B7D">依据：geom_to_elec_angle / angle_to_pulse / calibrate_side_two_point</text><text id="number" data-pptx-role="page-number" x="1224" y="674" text-anchor="end" font-size="14" fill="#586B7D">08 / 16</text></svg>
