<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="28" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F7F9FC"/>
<g id="title" data-pptx-bounds="56 38 1168 108" fill="#173B57"><text x="56" y="65" font-size="20" fill="#2867A8">05 / 正运动学 FK</text><text x="56" y="120" font-size="44" font-weight="bold">正解：从两个角度算到笔尖</text></g>
<g id="fk-step-elbows" data-pptx-bounds="56 172 744 134" fill="#213547"><text x="56" y="205" font-size="32" font-weight="bold" fill="#2867A8">01  由输入角求两肘点</text><g id="elbow-equations" data-pptx-replace-with="formula" data-pptx-x="56" data-pptx-y="222" data-pptx-width="738" data-pptx-height="78" data-pptx-bounds="56 222 738 78"><metadata type="application/json"><![CDATA[{"latex":"\\begin{aligned}E_1&=(L_2\\cos\\theta_1,L_2\\sin\\theta_1)\\\\E_2&=(L_1+L_3\\cos\\theta_2,L_3\\sin\\theta_2)\\end{aligned}","display":"block","font_size":26,"color":"#213547","align":"left"}]]></metadata><text x="56" y="247" font-size="26">E₁ = (L₂ cos θ₁, L₂ sin θ₁)<tspan x="56" dy="38">E₂ = (L₁ + L₃ cos θ₂, L₃ sin θ₂)</tspan></text></g></g>
<g id="fk-step-wrist" data-pptx-bounds="56 333 744 114" fill="#213547"><text x="56" y="370" font-size="32" font-weight="bold" fill="#586B7D">02  两圆相交求腕点 W</text><text x="56" y="421">以 E₁、E₂ 为圆心，半径分别为 L₄、L₅。</text></g>
<g id="fk-step-tip" data-pptx-bounds="56 472 744 150" fill="#213547"><text x="56" y="508" font-size="32" font-weight="bold" fill="#D97421">03  沿从动臂方向叠加偏置</text><g id="tip-equation" data-pptx-replace-with="formula" data-pptx-x="56" data-pptx-y="528" data-pptx-width="738" data-pptx-height="66" data-pptx-bounds="56 528 738 66"><metadata type="application/json"><![CDATA[{"latex":"P=W+L_t(\\cos(\\phi+\\delta),\\sin(\\phi+\\delta))","display":"block","font_size":26,"color":"#213547","align":"left"}]]></metadata><text x="56" y="570" font-size="26">P = W + Lₜ (cos(φ+δ), sin(φ+δ))</text></g><text x="56" y="614" font-size="20" fill="#586B7D">φ 为 E₁→W 的方向；近奇异或不可闭合时拒绝。</text></g>
