<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="28" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F7F9FC"/>
<g id="title" data-pptx-bounds="56 38 1168 108" fill="#173B57"><text x="56" y="65" font-size="20" fill="#2867A8">10 / 实机调试复盘</text><text x="56" y="120" font-size="44" font-weight="bold">偏边与 Y 压缩，要分层排查</text></g>
<g id="physical-evidence" data-pptx-bounds="56 174 498 443"><image href="../images/real_robot.jpg" x="56" y="174" width="498" height="374" preserveAspectRatio="xMidYMid meet"/><text x="56" y="584" font-size="20" fill="#586B7D">用户原始试写照片：笔迹靠边，质量待改善。</text></g>
<g id="diagnostic-layers" data-pptx-bounds="602 174 622 268" fill="#213547"><text x="602" y="210" font-size="32" font-weight="bold" fill="#173B57">分开检查三个层面</text><text x="602" y="267">几何：杆长、偏置与装配分支</text><text x="602" y="325">映射：左右零位、方向与增益</text><text x="602" y="383">坐标：板中心与整组字框位置</text><text x="602" y="431" font-size="20" fill="#586B7D">175° 是电气指令，不是笔尖的居中坐标。</text></g>
<g id="offset-finding" data-pptx-bounds="602 472 622 156" fill="#213547"><rect x="602" y="472" width="622" height="156" rx="12" fill="#EAF0F7"/><text x="626" y="516" font-size="32" font-weight="bold" fill="#D97421">CAD 已核实：偏置幅值 45°</text><text x="626" y="556" font-size="20">13 mm 为腕孔到笔夹心；60° 是夹口角。</text><text x="626" y="589" font-size="20" fill="#586B7D">网页用 +45° 观察侧假设，原固件 60° 未改；</text><text x="626" y="616" font-size="20" fill="#586B7D">实机压缩的根因与改进效果仍需标定验证。</text></g>
<text id="footer" data-pptx-role="footer" x="56" y="674" font-size="14" fill="#586B7D">依据：用户实机反馈、原始照片、CAD 网格偏置核查；不以放宽限位代替标定。</text><text id="number" data-pptx-role="page-number" x="1224" y="674" text-anchor="end" font-size="14" fill="#586B7D">11 / 16</text></svg>
