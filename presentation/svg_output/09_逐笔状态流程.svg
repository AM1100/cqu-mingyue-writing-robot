<g id="title" data-pptx-bounds="56 38 1168 108" fill="#173B57"><text x="56" y="65" font-size="20" fill="#2867A8">08 / 轨迹执行</text><text x="56" y="120" font-size="44" font-weight="bold">每一笔都按同一个状态流程执行</text></g>
<g id="stroke-sequence" data-pptx-bounds="56 174 1168 187" fill="#173B57"><rect x="56" y="174" width="1168" height="187" rx="12" fill="#EAF0F7"/><line x1="168" y1="256" x2="1106" y2="256" stroke="#CDD8E4" stroke-width="4" marker-end="url(#arrow)"/><circle cx="168" cy="256" r="9" fill="#2867A8"/><circle cx="356" cy="256" r="9" fill="#2867A8"/><circle cx="544" cy="256" r="9" fill="#2867A8"/><circle cx="732" cy="256" r="9" fill="#D97421"/><circle cx="920" cy="256" r="9" fill="#D97421"/><circle cx="1108" cy="256" r="9" fill="#2867A8"/><text x="168" y="228" text-anchor="middle">整图预检</text><text x="356" y="228" text-anchor="middle">抬笔</text><text x="544" y="228" text-anchor="middle">空移首点</text><text x="732" y="228" text-anchor="middle">缓降</text><text x="920" y="228" text-anchor="middle">写笔画</text><text x="1108" y="228" text-anchor="middle">抬笔</text><text x="168" y="321" font-size="20" text-anchor="middle" fill="#586B7D">包含笔间空移</text><text x="732" y="321" font-size="20" text-anchor="middle" fill="#586B7D">第三路斜坡</text><text x="1108" y="321" font-size="20" text-anchor="middle" fill="#586B7D">下一笔 / 待机</text></g>
<g id="draw-code" data-pptx-bounds="56 397 690 232"><rect x="56" y="397" width="690" height="232" rx="12" fill="#173B57"/><text xml:space="preserve" x="80" y="439" font-family="Consolas, Microsoft YaHei" font-size="22" fill="#FFFFFF">for stroke in strokes:<tspan x="80" dy="33">    self.lift(True)</tspan><tspan x="80" dy="33">    self.move(*stroke[0], speed=travel_speed)</tspan><tspan x="80" dy="33">    self.lift(False)</tspan><tspan x="80" dy="33">    # move through stroke[1:]</tspan><tspan x="80" dy="33">    self.lift(True)</tspan></text></g>
<g id="stroke-rules" data-pptx-bounds="790 397 434 232" fill="#213547"><text x="790" y="438" font-size="32" font-weight="bold" fill="#173B57">先保证全程可达</text><text x="790" y="492">不静默缩小或移到边缘，<tspan x="790" dy="42">不可达就整图拒绝。</tspan></text><text x="790" y="593" font-size="20" fill="#586B7D">异常与中断尝试抬笔，并清理 PWM。</text></g>
