<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="28" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F7F9FC" />
<g id="title" data-pptx-bounds="56 38 1168 108" fill="#173B57"><text x="56" y="65" font-size="20" fill="#2867A8">附录 A / 公式备查</text><text x="56" y="120" font-size="44" font-weight="bold">正逆解的关键表达式</text></g>
<g id="wrist-intersection" data-pptx-bounds="56 171 1168 175" fill="#213547"><text x="56" y="205" font-weight="bold" fill="#173B57">正解：两圆交点</text><g id="intersection-formulas" data-pptx-replace-with="formula" data-pptx-x="56" data-pptx-y="221" data-pptx-width="1168" data-pptx-height="113" data-pptx-bounds="56 221 1168 113"><metadata type="application/json"><![CDATA[{"latex":"\\begin{aligned}a&=\\frac{L_4^2-L_5^2+d^2}{2d},\\quad h=\\sqrt{L_4^2-a^2}\\\\W&=E_1+a\\hat{u}+s_Wh\\hat{n}\\end{aligned}","display":"block","font_size":26,"color":"#213547","align":"left"}]]></metadata><text x="56" y="263" font-size="26">a = (L₄² − L₅² + d²)/(2d),　h = √(L₄² − a²)<tspan x="56" dy="47">W = E₁ + a û + sW h n̂</tspan></text></g></g>
<g id="inverse-angles" data-pptx-bounds="56 367 1168 192" fill="#213547"><text x="56" y="402" font-weight="bold" fill="#173B57">逆解：左右余弦定理</text><g id="inverse-formulas" data-pptx-replace-with="formula" data-pptx-x="56" data-pptx-y="414" data-pptx-width="1168" data-pptx-height="137" data-pptx-bounds="56 414 1168 137"><metadata type="application/json"><![CDATA[{"latex":"\\begin{aligned}\\theta_1&=\\operatorname{atan2}(y,x)+s_1\\arccos\\frac{L_2^2+r^2-L_{eff}^2}{2L_2r}\\\\\\theta_2&=\\operatorname{atan2}(w_y,w_x-L_1)+s_2\\arccos\\frac{L_3^2+q^2-L_5^2}{2L_3q}\\end{aligned}","display":"block","font_size":26,"color":"#213547","align":"left"}]]></metadata><text x="56" y="459" font-size="26">θ₁ = atan2(y,x) + s₁ acos[(L₂² + r² − L_eff²)/(2L₂r)]<tspan x="56" dy="58">θ₂ = atan2(wy,wx−L₁) + s₂ acos[(L₃² + q² − L₅²)/(2L₃q)]</tspan></text></g></g>
<g id="formula-definitions" data-pptx-bounds="56 581 1168 64" fill="#586B7D" font-size="20"><text x="56" y="606">d 为两肘距离；û 沿 E₁→E₂，n̂ 为其左法向；r 为 A→P 距离，q 为 B→W 距离。</text><text x="56" y="637">演示选 s₁=+1，s₂=−1，sW=+1；δ=+45° 为观察侧假设。实机先确认分支与偏置方向。</text></g>
<text id="footer" data-pptx-role="footer" x="56" y="674" font-size="14" fill="#586B7D">依据：forward / solve_pure_geom。求解前检查余弦定义域；求解后 FK 回代和限位校核。</text><text id="number" data-pptx-role="page-number" x="1224" y="674" text-anchor="end" font-size="14" fill="#586B7D">15 / 16</text></svg>
