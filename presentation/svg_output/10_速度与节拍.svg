<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="28" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F7F9FC"/>
<g id="title" data-pptx-bounds="56 38 1168 108" fill="#173B57"><text x="56" y="65" font-size="20" fill="#2867A8">09 / 代码与速度</text><text x="56" y="120" font-size="44" font-weight="bold">20 ms 节拍里，计算也占时间</text></g>
<g id="frame-step" data-pptx-bounds="56 174 1168 113" fill="#173B57"><text x="56" y="216" font-size="32">每帧位移随速度变化</text><text x="56" y="269">20 mm/s → 0.4 mm/帧　　30 mm/s → 0.6 mm/帧</text></g>
<g id="frame-code" data-pptx-bounds="56 320 734 300"><rect x="56" y="320" width="734" height="300" rx="12" fill="#173B57"/><text xml:space="preserve" x="80" y="366" font-family="Consolas, Microsoft YaHei" font-size="22" fill="#FFFFFF">for point in segment(<tspan x="80" dy="33">        start, (x, y), speed):</tspan><tspan x="80" dy="33">    frame_start = _ticks_ms()</tspan><tspan x="80" dy="33">    u, v = pulses(*point)</tspan><tspan x="80" dy="33">    set_pulse_us(self.left, u)</tspan><tspan x="80" dy="33">    set_pulse_us(self.right, v)</tspan><tspan x="80" dy="33">    _ramp_sleep(frame_start)</tspan></text></g>
<g id="frame-constraints" data-pptx-bounds="832 320 392 300" fill="#213547"><text x="832" y="366" font-size="32" font-weight="bold" fill="#D97421">扣除计算耗时</text><text x="832" y="421">只补足剩余帧时间，<tspan x="832" dy="43">避免重复固定等待。</tspan></text><text x="832" y="533" font-size="20" fill="#586B7D">最大步长 0.8 mm；<tspan x="832" dy="32">单帧脉宽增量上限 30 μs；</tspan><tspan x="832" dy="32">名义速度不等于实机实测速度。</tspan></text></g>
<text id="footer" data-pptx-role="footer" x="56" y="674" font-size="14" fill="#586B7D">依据：frame_step_mm / segment / Plotter.move / _ramp_sleep；代码节选。</text><text id="number" data-pptx-role="page-number" x="1224" y="674" text-anchor="end" font-size="14" fill="#586B7D">10 / 16</text></svg>
